name: Pinion
options:
  bundleIdPrefix: com.pinion
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Alamofire:
    type: framework
    platform: iOS
    sources:
    - path: Alamofire
      excludes:
      - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinion.reel.Alamofire
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_FILE: Alamofire/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEFINES_MODULE: 'YES'
        PRODUCT_MODULE_NAME: Alamofire
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
  Pinion:
    type: application
    platform: iOS
    sources:
    - path: Pinion
    resources:
    - path: PrivacyInfo.xcprivacy
    dependencies:
    - target: Alamofire
    - package: AppsFlyerLib
      product: AppsFlyerLib-Static
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinion.reel
        PRODUCT_NAME: Pinion
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Chikinion
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Pinion-Info.plist
  PinionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: PinionTests
    dependencies:
    - target: Pinion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinion.reel.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pinion.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pinion
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  Pinion:
    build:
      targets:
        Pinion: all
        PinionTests:
        - test
    test:
      targets:
      - PinionTests
packages:
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Static
    from: 6.17.9
